<script>

const PRODUCTS = [
  { id:"cup630", cat:"cup", name:"Cup Compack 630 mL", short:"Isi 12 pcs per lusin", price:30000, unit:"lusin",
    ready:true, kind:"cup",
    desc:"Kemasan makanan sekali pakai dari sekam padi, pati, dan chitosan. Ringan, cukup kuat, dan mudah terurai.",

  { id:"kotak", cat:"kotak", name:"Kotak makan Compack", short:"Untuk katering dan restoran", price:0, unit:"",
    ready:false, kind:"box",

const NAV = [
  {h:"#/",          key:"home",    label:"Beranda",  ic:"home"},
  {h:"#/katalog",   key:"katalog", label:"Katalog",  ic:"grid"},
  {h:"#/kustom",    key:"kustom",  label:"Kustom",   ic:"brush"},
  {h:"#/keranjang", key:"cart",    label:"Keranjang",ic:"cart"},
  {h:"#/akun",      key:"akun",    label:"Akun",     ic:"user"}
];

/* ===================== STATE ===================== */
const state = { cat:"semua", q:"", cart:{}, custom:{ size:"Cup 630 mL", color:"#f6c93b", eco:true, logo:null } };
try { const s = localStorage.getItem("compack_cart"); if (s) state.cart = JSON.parse(s) || {}; } catch(e){}
function saveCart(){ try { localStorage.setItem("compack_cart", JSON.stringify(state.cart)); } catch(e){} updateBadge(); }

/* ===================== HELPER ===================== */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const rp = n => "Rp" + Number(n).toLocaleString("id-ID");
const byId = id => PRODUCTS.find(p => p.id === id);
const cartCount = () => Object.values(state.cart).reduce((a,b)=>a+b,0);
const cartTotal = () => Object.entries(state.cart).reduce((a,[id,q])=>a+byId(id).price*q,0);

const ICONS = {
  home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',
  grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
  cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11l2-8H6"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  brush:'<path d="M3 21c3 0 5-1 5-4a3 3 0 0 0-3-3c-3 0-2 4-2 7z"/><path d="M9 14L20 3l1 1-11 11"/>',
  search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/>',
  back:'<path d="M15 18l-6-6 6-6"/>',
  upload:'<path d="M12 16V4M7 9l5-5 5 5M4 20h16"/>',
  gift:'<rect x="3" y="8" width="18" height="13" rx="2"/><path d="M12 8v13M3 13h18M12 8c-3 0-5-1-5-3s3-2 5 3c2-5 5-5 5-3s-2 3-5 3"/>',
  leaf:'<path d="M5 19c0-9 5-14 15-15 0 10-5 15-15 15z"/><path d="M5 19l8-8"/>',
  shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
  recycle:'<path d="M4 12a8 8 0 0 1 14-5l2 2M20 12a8 8 0 0 1-14 5l-2-2"/><path d="M20 4v5h-5M4 20v-5h5"/>',
  truck:'<path d="M2 6h11v10H2zM13 10h4l3 3v3h-7z"/><circle cx="7" cy="18" r="1.8"/><circle cx="17" cy="18" r="1.8"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-4 3-6 7-6s7 2 7 6"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14c3 0 5 1.8 5 5"/>',
  landmark:'<path d="M3 10l9-6 9 6zM5 10v8M9 10v8M15 10v8M19 10v8M3 21h18"/>',
  building:'<rect x="5" y="3" width="14" height="18" rx="1"/><path d="M9 7h2M13 7h2M9 11h2M13 11h2M9 15h2M13 15h2"/>',
  wa:'<path d="M21 12a9 9 0 1 1-4-7.5L21 4l-1.5 4A9 9 0 0 1 21 12z"/><path d="M9 9c0 3 3 6 6 6l1-2-2-1-1 1c-1-.5-2-1.5-2.5-2.5l1-1-1-2z"/>'
};
const ic = (n, size) => `<svg class="i" viewBox="0 0 24 24"${size?` style="width:${size}px;height:${size}px"`:""}>${ICONS[n]}</svg>`;

/* ----- Ilustrasi SVG ----- */
function cupSVG(o={}){
  const band = o.color || null, logo = o.logo, eco = o.eco;
  const dark = band === "#2e7d32";
  const txtc = dark ? "#fff" : "#1f4d26";
  let mid;
  if (band) {
    mid = `<rect x="22" y="${logo?38:46}" width="56" height="${logo?36:20}" fill="${band}"/>` +
      (logo ? `<image href="${logo}" x="28" y="41" width="44" height="30" preserveAspectRatio="xMidYMid meet"/>`
            : `<text x="50" y="59" text-anchor="middle" font-size="7.5" font-weight="800" fill="${txtc}" font-family="Poppins,sans-serif">LOGO ANDA</text>`) +
      (eco ? `<text x="50" y="${logo?85:78}" text-anchor="middle" font-size="5" font-weight="700" fill="#2e7d32" font-family="Poppins,sans-serif">♻ RAMAH LINGKUNGAN</text>` : "");
  } else {
    mid = `<circle cx="50" cy="56" r="13" fill="#2e7d32"/><path d="M44 62c0-8 5-12 12-13 0 8-4 13-12 13z" fill="#f6c93b"/>`;
  }
  return `<svg viewBox="0 0 100 110" xmlns="http://www.w3.org/2000/svg"><ellipse cx="50" cy="103" rx="32" ry="4" fill="rgba(0,0,0,.12)"/><rect x="14" y="6" width="72" height="12" rx="4" fill="#cdbb8d"/><path d="M18 18h64l-7 78a6 6 0 0 1-6 5H31a6 6 0 0 1-6-5z" fill="#e6d8b4"/>${mid}</svg>`;
}
function boxSVG(o={}){
  const band = o.color || null, logo = o.logo, eco = o.eco;
  const dark = band === "#2e7d32";
  let mid;
  if (band) {
    mid = `<rect x="22" y="30" width="56" height="22" fill="${band}"/>` +
      (logo ? `<image href="${logo}" x="30" y="32" width="40" height="18" preserveAspectRatio="xMidYMid meet"/>`
            : `<text x="50" y="44" text-anchor="middle" font-size="7" font-weight="800" fill="${dark?"#fff":"#1f4d26"}" font-family="Poppins,sans-serif">LOGO ANDA</text>`) +
      (eco ? `<text x="50" y="60" text-anchor="middle" font-size="4.5" font-weight="700" fill="#2e7d32" font-family="Poppins,sans-serif">♻ RAMAH LINGKUNGAN</text>` : "");
  } else {
    mid = `<circle cx="50" cy="40" r="9" fill="#2e7d32"/><path d="M46 44c0-5 3-7 7-8 0 5-2 8-7 8z" fill="#f6c93b"/>`;
  }
  return `<svg viewBox="0 0 100 74" xmlns="http://www.w3.org/2000/svg"><ellipse cx="50" cy="68" rx="38" ry="4" fill="rgba(0,0,0,.12)"/><path d="M10 26h80l-6 34a8 8 0 0 1-8 6H24a8 8 0 0 1-8-6z" fill="#e6d8b4"/><path d="M10 26c0-8 20-14 40-14s40 6 40 14z" fill="#cdbb8d"/>${mid}</svg>`;
}
const art = p => p.kind === "box" ? boxSVG() : cupSVG();

/* ===================== KOMPONEN ===================== */
function productCard(p){
  return `<a class="card" href="#/produk/${p.id}">
    <div class="thumb">${art(p)}</div>
    <h3>${p.name}</h3><small>${p.short}</small>
    ${p.ready ? `<span class="price">${rp(p.price)} <small>/${p.unit}</small></span>` : `<span class="soon">Segera hadir</span>`}
  </a>`;
}
function filtered(){
  const q = state.q.trim().toLowerCase();
  return PRODUCTS.filter(p => (state.cat==="semua" || p.cat===state.cat) && (!q || (p.name+" "+p.short).toLowerCase().includes(q)));
}
function chipsHTML(){
  const list = [["semua","Semua"],["cup","Cup"],["kotak","Kotak makan"],["kustom","Kustom"]];
  return `<div class="chips">${list.map(([k,l])=>`<button class="chip ${state.cat===k?"active":""}" data-chip="${k}">${l}</button>`).join("")}</div>`;
}

/* ===================== HALAMAN ===================== */
const PARTNERS = [
  { ic:"leaf",     tag:"Mitra penyedia bahan",       items:["Petani/Pekebun penyedia bahan utama produk"] },
  { ic:"truck",    tag:"Mitra distribusi",           items:["Koperasi Mahasiswa Institut Teknologi Sepuluh Nopember (Kopma ITS)","Pedagang UMKM lokal"] },
  { ic:"users",    tag:"Mitra pemasaran & komunitas",items:["Komunitas Mahasiswa"] },
  { ic:"landmark", tag:"Mitra legal & regulasi",     items:["Pemerintahan","Dinas Lingkungan Hidup"] },
  { ic:"building", tag:"Mitra institusi",            items:["Institut"] }
];
function partnersHTML(){
  return `<section class="partners" id="mitra">
    <div class="p-head"><h2>Mitra Kami</h2><p>Compack tumbuh bersama para mitra yang peduli lingkungan.</p></div>
    <div class="p-grid">${PARTNERS.map(p=>`<div class="p-card">
      <span class="p-tag">${ic(p.ic,16)} ${p.tag}</span>
      <ul>${p.items.map(i=>`<li>${i}</li>`).join("")}</ul>
    </div>`).join("")}</div>
  </section>`;
}

function pageHome(){
  const list = filtered();
  return `<section class="fade">
    <div class="hero"><div class="wrap">
      <div>
        <h1>Kemasan makanan pengganti styrofoam</h1>
        <p>Dari sekam padi, pati, dan chitosan. Mudah terurai dan bisa jadi kompos.</p>
        <form class="search" id="searchForm">${ic("search")}<input id="searchInput" type="search" placeholder="Cari cup, kotak makan..." value="${state.q}" /><button type="submit">Cari</button></form>
      </div>
      <div class="hero-art">${cupSVG()}</div>
    </div></div>
    <div class="wrap">
      ${chipsHTML()}
      <div class="sec-title"><h2>Produk populer</h2><a href="#/katalog">Lihat semua</a></div>
      <div class="grid" id="prodGrid">${list.length ? list.map(productCard).join("") : `<p style="grid-column:1/-1;color:var(--muted);font-size:14px">Produk tidak ditemukan.</p>`}</div>
      <a class="promo" href="#/kustom">
        <span class="gift">${ic("gift",22)}</span>
        <span>Kemasan berhadiah untuk pembelian minimal tertentu. Mau kemasan dengan logo usahamu? Coba fitur kustom →</span>

        <div class="feat"><div class="ic">${ic("leaf")}</div><div><b>Bahan alami</b><span>Dibuat dari sekam padi, pati, dan chitosan.</span></div></div>
        <div class="feat"><div class="ic">${ic("shield")}</div><div><b>Antimikroba</b><span>Chitosan membantu menjaga kemasan tetap higienis.</span></div></div>
      </div>
      <div class="sec-title"><h2>Cara pembuatan Compack</h2></div>
      <div class="make">
        <div class="mk" style="--n:1"><span class="num">1</span>
          <svg viewBox="0 0 80 80"><path d="M16 46h48c0 12-10 20-24 20S16 58 16 46z" fill="#e6d8b4" stroke="#1f4d26" stroke-width="2.5"/><circle class="d d1" cx="28" cy="8" r="5" fill="#d9b44a"/><circle class="d d2" cx="40" cy="8" r="5" fill="#fff" stroke="#c9c9c9"/><circle class="d d3" cx="52" cy="8" r="5" fill="#8fc24b"/></svg>
          <b>Siapkan bahan</b><span>Sekam padi, pati, dan chitosan disiapkan sebagai bahan utama.</span></div>

          <b>Campur</b><span>Bahan diaduk hingga menyatu menjadi adonan.</span></div>
        <div class="mk" style="--n:3"><span class="num">3</span>
          <svg viewBox="0 0 80 80"><path d="M22 50h36l-4 22H26z" fill="#e6d8b4" stroke="#1f4d26" stroke-width="2.5"/><g class="press"><rect x="18" y="4" width="44" height="8" rx="3" fill="#2e7d32"/><rect x="36" y="12" width="8" height="14" fill="#1f4d26"/><rect x="24" y="26" width="32" height="10" rx="3" fill="#2e7d32"/></g></svg>
          <b>Cetak</b><span>Adonan dicetak menjadi bentuk cup atau kotak makan.</span></div>
        <div class="mk" style="--n:4"><span class="num">4</span>
          <svg viewBox="0 0 80 80"><circle class="rays" cx="40" cy="24" r="17" fill="none" stroke="#f6c93b" stroke-width="4" stroke-dasharray="4 7" stroke-linecap="round"/><circle class="sunc" cx="40" cy="24" r="9" fill="#f6c93b"/><path d="M26 52h28l-3 20H29z" fill="#e6d8b4" stroke="#1f4d26" stroke-width="2.5"/></svg>
          <b>Keringkan</b><span>Hasil cetakan dikeringkan hingga kokoh dan siap dipakai.</span></div>
        <div class="mk" style="--n:5"><span class="num">5</span>
          <svg viewBox="0 0 80 80"><path d="M8 72q32-18 64 0z" fill="#8a6d3b"/><g class="sprout"><path d="M40 64V42" stroke="#2e7d32" stroke-width="3" stroke-linecap="round"/><path d="M40 48c-12 0-15-10-15-10 10-1 15 4 15 10z" fill="#8fc24b"/><path d="M40 43c10 0 13-10 13-10-9-1-13 4-13 10z" fill="#a5d66a"/></g></svg>
          <b>Kembali ke alam</b><span>Setelah dipakai, kemasan terurai dan bisa jadi kompos.</span></div>
      </div>
      <div class="sec-title"><h2>Cara pesan</h2></div>
      <div class="steps">
        <div class="step"><i>1</i><b>Pilih produk</b><span>Lihat katalog dan masukkan ke keranjang.</span></div>
        <div class="step"><i>2</i><b>Kustom kemasan</b><span>Tambahkan logo dan warna label usahamu.</span></div>
        <div class="step"><i>3</i><b>Pesan via WhatsApp</b><span>Kirim pesanan dan kami proses.</span></div>

function pageCatalog(){
  const list = filtered();
  return `<section class="wrap fade">
    <h1 class="page-title">Katalog</h1>
    <form class="search" id="searchForm" style="max-width:none">${ic("search")}<input id="searchInput" type="search" placeholder="Cari cup, kotak makan..." value="${state.q}" /><button type="submit">Cari</button></form>
    ${chipsHTML()}
    <div class="grid" id="prodGrid" style="margin-top:14px">${list.length ? list.map(productCard).join("") : `<p style="grid-column:1/-1;color:var(--muted);font-size:14px;padding:20px 0">Produk tidak ditemukan.</p>`}</div>
  </section>`;
}

let detailQty = 1;
function pageProduct(id){
  const p = byId(id);
  if (!p) return pageNotFound();
  detailQty = 1;
  return `<section class="wrap fade">
    <a class="back" href="#/katalog">${ic("back")} Kembali</a>
    <div class="detail">
      <div class="d-hero">${art(p)}${p.id==="cup630"?`<span class="pill">630 mL</span>`:""}</div>
      <div>
        <div class="t-row"><h1>${p.name}</h1>${p.ready?`<div class="p">${rp(p.price)}<small>per ${p.unit} (12 pcs)</small></div>`:""}</div>
        <p class="desc">${p.desc}</p>
        ${p.specs?`<div class="specs">${p.specs.map(([a,b])=>`<div class="spec">${a}<b>${b}</b></div>`).join("")}</div>`:""}
        <h4 class="sub">Keunggulan</h4>
        <div class="tags">${p.tags.map((t,i)=>`<span class="tag ${i===p.tags.length-1?"dark":""}">${t}</span>`).join("")}</div>
        <div class="buy">
          ${p.ready?`<div class="qty"><button data-qty="-1" aria-label="Kurangi">−</button><span id="dq">1</span><button data-qty="1" aria-label="Tambah">+</button></div>
          <button class="btn" data-add="${p.id}">Tambah ke keranjang</button>`
          :`<button class="btn" disabled>Segera hadir</button>`}
        </div>
      </div>
    </div>
  </section>`;
}

function pageCustom(){
  const c = state.custom;
  return `<section class="wrap fade">
    <h1 class="page-title">Kemasan Kustom</h1>
    <div class="custom">
      <div class="preview"><span class="pill">Pratinjau</span><div id="pv" style="display:contents"></div></div>
      <div>
        <h4 class="sub" style="margin-top:0">Pilih ukuran</h4>
        <div class="sizes">${["Cup 630 mL","Kotak makan","Lainnya"].map(s=>`<button class="size ${c.size===s?"active":""}" data-size="${s}">${s}</button>`).join("")}</div>

        <h4 class="sub">Logo usaha</h4>
        <label class="upload ${c.logo?"has":""}" id="uploadLbl" for="logoFile">${ic("upload")}<span id="uploadTxt">${c.logo?"Logo terpasang · klik untuk ganti":"Unggah logo (PNG atau JPG)"}</span></label>
        <input id="logoFile" type="file" accept="image/png,image/jpeg" hidden />

        <h4 class="sub">Warna label</h4>
        <div class="swatches">${[["#f6c93b","Kuning"],["#2e7d32","Hijau tua"],["#a5d66a","Hijau muda"],["#ffffff","Putih"]].map(([h,n])=>`<button class="swatch ${c.color===h?"active":""}" data-color="${h}" style="background:${h}" aria-label="${n}"></button>`).join("")}</div>

        <div class="toggle" id="ecoToggle"><span>Tambah label "ramah lingkungan"</span><span class="switch ${c.eco?"on":""}" id="ecoSw"></span></div>

        <a class="btn block" id="waBtn" style="margin-top:20px" target="_blank" rel="noopener">Konsultasi desain via WhatsApp</a>
      </div>
    </div>
  </section>`;
}
function updateCustom(){
  const c = state.custom;
  const o = { color:c.color, logo:c.logo, eco:c.eco };
  $("#pv").innerHTML = c.size==="Kotak makan" ? boxSVG(o) : cupSVG(o);
  const sv = $("#pv svg"); if (sv) sv.classList.add("pop");
  const msg = `Halo Compack, saya mau konsultasi desain kemasan kustom.\nUkuran: ${c.size}\nWarna label: ${c.color}\nLabel ramah lingkungan: ${c.eco?"Ya":"Tidak"}\nLogo: ${c.logo?"akan saya kirim di chat ini":"belum ada"}`;
  $("#waBtn").href = `https://wa.me/${WA}?text=${encodeURIComponent(msg)}`;
}

function pageCart(){
  const ids = Object.keys(state.cart);
  if (!ids.length) return `<section class="wrap fade"><h1 class="page-title">Keranjang</h1>
    <div class="empty">${ic("cart")}<p>Keranjang kamu masih kosong.</p><a class="btn" href="#/katalog">Belanja sekarang</a></div></section>`;
  const items = ids.map(id=>{ const p=byId(id), q=state.cart[id]; return `<div class="cart-item">
      <div class="thumb">${art(p)}</div>
      <div class="info"><h3>${p.name}</h3><div class="price">${rp(p.price)} <small>/${p.unit}</small></div>
        <div class="qty"><button data-cq="${id}" data-d="-1">−</button><span>${q}</span><button data-cq="${id}" data-d="1">+</button></div></div>
      <button class="rm" data-rm="${id}">Hapus</button></div>`; }).join("");
  return `<section class="wrap fade"><h1 class="page-title">Keranjang</h1>
    <div class="cart-wrap"><div class="cart-list">${items}</div>
    <div class="summary"><div class="row"><span>Jumlah</span><span>${cartCount()} lusin</span></div>
      <div class="row total"><span>Total</span><span>${rp(cartTotal())}</span></div>
      <a class="btn block" id="checkout" target="_blank" rel="noopener">Pesan via WhatsApp</a></div></div></section>`;
}
function checkoutLink(){
  const lines = Object.entries(state.cart).map(([id,q])=>`- ${byId(id).name} x ${q} lusin (${rp(byId(id).price*q)})`).join("\n");
  const msg = `Halo Compack, saya mau pesan:\n${lines}\nTotal: ${rp(cartTotal())}`;
  return `https://wa.me/${WA}?text=${encodeURIComponent(msg)}`;
}

function pageAccount(){
  return `<section class="wrap fade"><h1 class="page-title">Akun</h1>
    <div class="info-card"><b>Tentang Compack</b><br>Compack adalah kemasan makanan pengganti styrofoam dari sekam padi, pati, dan chitosan. Mudah terurai dan bisa jadi kompos.</div>
    <div class="info-card"><b>Fitur akun</b><br>Login dan riwayat pesanan segera hadir. Untuk sementara, pesanan diproses lewat WhatsApp.</div>
    <a class="btn block" style="max-width:420px" href="https://wa.me/${WA}" target="_blank" rel="noopener">Hubungi kami via WhatsApp</a></section>`;
}
function pageNotFound(){
  return `<section class="wrap fade"><div class="empty"><p>Halaman tidak ditemukan.</p><a class="btn" href="#/">Ke beranda</a></div></section>`;
}

/* ===================== ROUTER ===================== */
function currentKey(path){
  if (path==="/"||path==="") return "home";
  if (path.startsWith("/katalog")||path.startsWith("/produk")) return "katalog";
  if (path.startsWith("/kustom")) return "kustom";
  if (path.startsWith("/keranjang")) return "cart";
  if (path.startsWith("/akun")) return "akun";
  return "";
}
function renderNav(key){
  $("#dnav").innerHTML = NAV.filter(n=>n.key!=="cart").map(n=>`<a href="${n.h}" class="${n.key===key?"active":""}">${n.label}</a>`).join("");
  $("#bnav").innerHTML = NAV.map(n=>`<a href="${n.h}" class="${n.key===key?"active":""}">${ic(n.ic)}<span>${n.label}</span>${n.key==="cart"?`<span class="badge ${cartCount()?"show":""}" data-badge>${cartCount()}</span>`:""}</a>`).join("");
}
let lastCount = cartCount();
function updateBadge(){
  const n = cartCount();
  const changed = n !== lastCount; lastCount = n;
  $$("[data-badge], #badge-top").forEach(b=>{
    b.textContent = n; b.classList.toggle("show", n>0);
    if (changed){ b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); }
  });
  if (changed){ const cb = $(".cart-btn"); cb.classList.remove("wiggle"); void cb.offsetWidth; cb.classList.add("wiggle"); }
}
/* ----- Animasi muncul saat scroll ----- */
let io = null;
function reveal(){
  const els = $$(".card,.feat,.promo,.spec,.tag,.cart-item,.info-card,.step,.summary,.sec-title,.p-card,.mk");
  if (!("IntersectionObserver" in window)) { els.forEach(el=>el.classList.add("rv","in")); return; }
  if (!io) io = new IntersectionObserver(es=>{
    es.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add("in"); io.unobserve(en.target); } });
  }, { threshold:.12, rootMargin:"0px 0px -30px 0px" });
  els.forEach((el,i)=>{
    if (el.classList.contains("rv")) return;
    el.classList.add("rv");
    el.style.setProperty("--d", (i%6)*80 + "ms");
    io.observe(el);
  });
}

function route(){
  const path = (location.hash.replace(/^#/,"") || "/").split("?")[0];
  const app = $("#app");
  let html;
  if (path==="/") html = pageHome();
  else if (path==="/katalog") html = pageCatalog();
  else if (path.startsWith("/produk/")) html = pageProduct(path.split("/")[2]);
  else if (path==="/kustom") html = pageCustom();
  else if (path==="/keranjang") html = pageCart();
  else if (path==="/akun") html = pageAccount();
  else html = pageNotFound();
  app.innerHTML = html;
  renderNav(currentKey(path));
  updateBadge();
  if (path==="/kustom") updateCustom();
  if (path==="/keranjang" && $("#checkout")) $("#checkout").href = checkoutLink();
  window.scrollTo(0,0);
  reveal();
}

/* ===================== EVENT ===================== */
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(()=>t.classList.remove("show"), 1600);
}
function refreshGrid(){
  const g = $("#prodGrid"); if (!g) return;
  const list = filtered();
  g.innerHTML = list.length ? list.map(productCard).join("") : `<p style="grid-column:1/-1;color:var(--muted);font-size:14px;padding:20px 0">Produk tidak ditemukan.</p>`;
  reveal();
}

document.addEventListener("click", e=>{
  const t = e.target.closest("button, label, .toggle");
  if (!t) return;

  if (t.dataset.chip){
    if (t.dataset.chip==="kustom"){ location.hash = "#/kustom"; return; }
    state.cat = t.dataset.chip;
    $$(".chip").forEach(c=>c.classList.toggle("active", c.dataset.chip===state.cat));
    refreshGrid();
  }
  if (t.dataset.qty){
    detailQty = Math.max(1, detailQty + Number(t.dataset.qty));
    $("#dq").textContent = detailQty;
  }
  if (t.dataset.add){
    state.cart[t.dataset.add] = (state.cart[t.dataset.add]||0) + detailQty;
    saveCart(); toast(`✓ ${detailQty} lusin ditambahkan`);
    t.classList.remove("pulse"); void t.offsetWidth; t.classList.add("pulse");
  }
  if (t.dataset.cq){
    const id = t.dataset.cq, q = (state.cart[id]||0) + Number(t.dataset.d);
    if (q<=0) delete state.cart[id]; else state.cart[id] = q;
    saveCart(); route();
  }
  if (t.dataset.rm){ delete state.cart[t.dataset.rm]; saveCart(); route(); }
  if (t.dataset.size){
    state.custom.size = t.dataset.size;
    $$(".size").forEach(s=>s.classList.toggle("active", s.dataset.size===state.custom.size));
    updateCustom();
  }
  if (t.dataset.color){
    state.custom.color = t.dataset.color;
    $$(".swatch").forEach(s=>s.classList.toggle("active", s.dataset.color===state.custom.color));
    updateCustom();
  }
  if (t.id==="ecoToggle" || t.closest("#ecoToggle")){
    state.custom.eco = !state.custom.eco;
    $("#ecoSw").classList.toggle("on", state.custom.eco);
    updateCustom();
  }
});

document.addEventListener("submit", e=>{
  if (e.target.id==="searchForm"){
    e.preventDefault();
    state.q = $("#searchInput").value;
    if (location.hash.startsWith("#/katalog")) refreshGrid(); else location.hash = "#/katalog";
  }
});
document.addEventListener("input", e=>{
  if (e.target.id==="searchInput" && location.hash.startsWith("#/katalog")){ state.q = e.target.value; refreshGrid(); }
});
document.addEventListener("change", e=>{
  if (e.target.id==="logoFile" && e.target.files[0]){
    const f = e.target.files[0];
    if (f.size > 4*1024*1024){ toast("Ukuran logo maksimal 4 MB"); return; }
    const r = new FileReader();
    r.onload = ()=>{
      state.custom.logo = r.result;
      $("#uploadLbl").classList.add("has");
      $("#uploadTxt").textContent = "Logo terpasang · klik untuk ganti";
      updateCustom();
    };
    r.readAsDataURL(f);
  }
});

window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
